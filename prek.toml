[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "fmt"
name = "cargo fmt (nightly)"
language = "system"
# Нестабильные опции в rustfmt.toml (imports_granularity, imports_layout,
# group_imports) понимает только nightly-rustfmt. Проксируем через bash,
# чтобы сам хук оставался channel-agnostic, а рантайм брал nightly-бинари
# из toolchain'а напрямую (rustup proxy по умолчанию резолвится в stable).
entry = "bash -c 'NIGHTLY_BIN=\"$(dirname \"$(rustup which --toolchain nightly rustfmt)\")\"; PATH=\"$NIGHTLY_BIN:$PATH\" cargo fmt \"$@\"' --"
types = ["rust"]
pass_filenames = false
args = ["--check"]

[[repos.hooks]]
id = "clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy"
types = ["rust"]
pass_filenames = false
args = ["--", "-D", "warnings"]

[[repos.hooks]]
id = "protolint"
name = "protolint"
language = "system"
entry = "protolint lint"
files = "\\.proto$"
