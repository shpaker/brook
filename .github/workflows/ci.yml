name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  protolint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install protolint
        run: brew install protolint
      - name: protolint
        run: protolint lint proto/

  fmt:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --check

  clippy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install protoc
        run: brew install protobuf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy -- -D warnings

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install protoc
        run: brew install protobuf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test
