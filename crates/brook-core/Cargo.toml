[package]
name       = "brook-core"
version.workspace = true
edition.workspace = true

[features]
# Включает in-memory реализации портов (`MemoryPieceStorage`, `MemoryTQueueStore`).
# Нужен для тестов `brook-core` и для тестов/примеров в других крейтах workspace'а.
# Код боевых бинарей не должен зависеть от этой фичи.
test-utils = []

[dependencies]
tokio        = { workspace = true }
tracing      = { workspace = true }
thiserror    = { workspace = true }
uuid         = { workspace = true }
bytes        = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
async-trait  = { workspace = true }
rand         = { workspace = true }

[dev-dependencies]
# Самоссылка включает фичу `test-utils` для юнит-тестов крейта,
# при этом обычная сборка `brook-core` эту фичу не тянет.
brook-core = { path = ".", features = ["test-utils"] }
# Интеграционные тесты fault-injection используют реальный HTTP-адаптер против
# wiremock. Попадают только в dev-профиль — normal-deps `brook-core` остаются
# чистыми (hex-инвариант), gate `cargo tree -p brook-core | grep reqwest` проходит.
brook-http = { path = "../brook-http" }
wiremock   = { workspace = true }
tempfile   = { workspace = true }
tokio      = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
