syntax = "proto3";
package brook.v1;

import "google/protobuf/timestamp.proto";

// Основной сервис управления загрузками.
service BrookService {
  // Добавить новый файл в очередь.
  rpc Add(AddRequest) returns (AddResponse);
  // Удалить файл по идентификатору.
  rpc Remove(RemoveRequest) returns (RemoveResponse);

  // Поставить загрузку файла на паузу.
  rpc Pause(IdRequest) returns (StatusResponse);
  // Возобновить приостановленную загрузку файла.
  rpc Resume(IdRequest) returns (StatusResponse);
  // Перезапустить упавшую загрузку (Failed → Pending).
  rpc Retry(IdRequest) returns (StatusResponse);

  // Server-streaming: статусные переходы известных файлов. Стартовое
  // состояние клиент получает через GetRecently/GetFiles, стрим отдаёт
  // только последующие изменения статуса. На переполнении broadcast-
  // канала сервер закрывает стрим с Status::DataLoss; клиент по
  // reconnect-ветке сам переснимает состояние через GetRecently.
  rpc WatchStatus(WatchStatusRequest) returns (stream StatusEvent);

  // Server-streaming: тики прогресса по всем файлам.
  rpc WatchProgress(WatchProgressRequest) returns (stream ProgressTick);

  // Записи с активностью за интервал [since, now]: любые изменения в
  // самой записи File или в её кусках/попытках. Сортировка по
  // last_activity_at DESC. Используется главным экраном TUI ("recently").
  rpc GetRecently(GetRecentlyRequest) returns (GetRecentlyResponse);

  // Пагинированный список всех загрузок (без фильтра по времени).
  // ORDER BY created_at DESC. Используется экраном "history" с
  // infinite-scroll.
  rpc GetFiles(GetFilesRequest) returns (GetFilesResponse);

  // Настройки демона — дефолты и политики — для префилла модалок клиента.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);

  // Попросить демона корректно завершиться. Сервер отдаёт `StatusResponse`
  // сразу (до реального exit'а) и инициирует graceful-shutdown tonic'а
  // с последующим драйном менеджера. Клиент (TUI) использует это, чтобы
  // остановить демон, который сам же и запустил, при выходе из UI.
  rpc Shutdown(ShutdownRequest) returns (StatusResponse);
}

// Уникальный идентификатор файла (UUID в виде строки).
message FileId {
  string value = 1;
}

// Параметры создаваемого файла.
message FileSpec {
  string url = 1;
  // Директория назначения.
  string target_dir = 2;
  // Явно заданное имя файла (пусто — вывести из Content-Disposition/URL).
  optional string filename = 3;
}

// Статус файла.
enum FileStatus {
  FILE_STATUS_UNSPECIFIED = 0;
  FILE_STATUS_PENDING = 1;
  FILE_STATUS_RUNNING = 2;
  FILE_STATUS_PAUSED = 3;
  FILE_STATUS_RETRYING = 4;
  FILE_STATUS_DONE = 5;
  FILE_STATUS_FAILED = 6;
  FILE_STATUS_CANCELLED = 7;
}

// Полное состояние файла. Без прогресса — прогресс отдельным стримом
// WatchProgress.
message File {
  FileId id = 1;
  FileSpec spec = 2;
  FileStatus status = 3;
  // Номер текущей попытки (с 1).
  uint32 attempt = 4;
  // Заполняется только для FAILED / RETRYING.
  optional string error = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // Итоговая средняя скорость загрузки (байт/сек). Заполняется только
  // для DONE — weighted average по байтам из всех успешных попыток.
  optional double avg_speed_bps = 8;
  // Кол-во разных воркеров, реально качавших хотя бы один piece файла.
  // Заполняется только для DONE.
  optional uint32 workers_count = 9;
  // Итоговый размер в байтах (из inspect). Пусто до завершения
  // inspect-зонда и в streaming-режиме без Content-Length.
  optional uint64 total_size = 10;
}

// Статусное событие в стриме `WatchStatus`. Несёт переход одного
// файла в новый статус. `description` — свободный текст; заполняется
// только при `status = FAILED` (туда уезжает сообщение об ошибке),
// на остальных переходах пуст.
message StatusEvent {
  FileId id = 1;
  FileStatus status = 2;
  optional string description = 3;
}

// Тик прогресса по одному файлу.
message ProgressTick {
  FileId file_id = 1;
  // Доля скачанного, 0.0..=1.0.
  double progress = 2;
  uint64 bytes_done = 3;
  // 0, если размер неизвестен.
  uint64 bytes_total = 4;
  double speed_bps = 5;
  // Отсутствует, если неизвестно.
  optional uint64 eta_secs = 6;
  // Сколько воркеров работает над файлом в текущей сессии. Фиксировано
  // на сессию (compute_workers по total_size); для no-Range всегда 1.
  uint32 workers_count = 7;
}

message AddRequest {
  FileSpec spec = 1;
}

message AddResponse {
  // Полный снимок созданной записи. Клиент может сразу вставить её в
  // свой view-model, не дожидаясь дельта-событий из WatchFile.
  File file = 1;
}

message RemoveRequest {
  FileId id = 1;
}

message RemoveResponse {
}

// Запрос по идентификатору файла.
message IdRequest {
  FileId id = 1;
}

// Универсальный ответ об успехе или ошибке операции.
message StatusResponse {
  bool ok = 1;
  // Описание ошибки при ok = false.
  string message = 2;
}

// Параметры подписки на статусные события.
message WatchStatusRequest {
}

// Параметры подписки на прогресс-тики.
message WatchProgressRequest {
}

// Запросить записи с активностью за интервал [since, now].
message GetRecentlyRequest {
  // Нижняя граница активности (включительно). Клиент обычно выставляет
  // now - 24h. Поле обязательно.
  google.protobuf.Timestamp since = 1;
}

message GetRecentlyResponse {
  // Сортировка по last_activity_at DESC.
  repeated File files = 1;
}

// Пагинированный запрос всех загрузок.
message GetFilesRequest {
  // Сколько строк пропустить с начала отсортированного списка.
  uint32 offset = 1;
  // Размер страницы. 0 → серверный дефолт (50). Сервер кэпит сверху
  // (cap 200), чтобы не возвращать произвольно большой ответ.
  uint32 limit = 2;
}

message GetFilesResponse {
  // Сортировка по created_at DESC.
  repeated File files = 1;
  // true, если за этой страницей есть ещё записи (сервер вернул ровно
  // effective_limit). Клиент использует для инфинит-скролла.
  bool has_more = 2;
}

message GetSettingsRequest {
}

message ShutdownRequest {
}

message GetSettingsResponse {
  // Дефолт для префилла Add-модалки.
  string default_dir = 1;
}
