syntax = "proto3";
package brook.v1;

import "google/protobuf/timestamp.proto";

// Основной сервис управления загрузками.
service BrookService {
  // Получить список всех загрузок.
  rpc List(ListRequest) returns (ListResponse);
  // Добавить новую загрузку.
  rpc Add(AddRequest) returns (AddResponse);
  // Удалить загрузку по идентификатору.
  rpc Remove(RemoveRequest) returns (RemoveResponse);

  // Поставить загрузку на паузу.
  rpc Pause(IdRequest) returns (StatusResponse);
  // Возобновить приостановленную загрузку.
  rpc Resume(IdRequest) returns (StatusResponse);
  // Отменить загрузку.
  rpc Cancel(IdRequest) returns (StatusResponse);

  // Поставить все загрузки на паузу.
  rpc PauseAll(PauseAllRequest) returns (StatusResponse);
  // Возобновить все приостановленные загрузки.
  rpc ResumeAll(ResumeAllRequest) returns (StatusResponse);

  // Server-streaming: события по всем известным загрузкам.
  rpc Watch(WatchRequest) returns (stream Event);
}

// Уникальный идентификатор загрузки (UUID в виде строки).
message DownloadId {
  string value = 1;
}

// Параметры создаваемой загрузки.
message DownloadSpec {
  string url = 1;
  // Директория назначения.
  string target_dir = 2;
  // Явно заданное имя файла (пусто — вывести из Content-Disposition/URL).
  optional string filename = 3;
  // Сколько параллельных воркеров. `0` — сервер подставит дефолт.
  uint32 workers = 4;
}

// Состояние загрузки.
enum DownloadState {
  DOWNLOAD_STATE_UNSPECIFIED = 0;
  DOWNLOAD_STATE_QUEUED = 1;
  DOWNLOAD_STATE_RUNNING = 2;
  DOWNLOAD_STATE_PAUSED = 3;
  DOWNLOAD_STATE_RETRYING = 4;
  DOWNLOAD_STATE_DONE = 5;
  DOWNLOAD_STATE_FAILED = 6;
  DOWNLOAD_STATE_CANCELLED = 7;
}

// Текущий прогресс загрузки.
message Progress {
  uint64 bytes_done = 1;
  // 0, если размер неизвестен.
  uint64 bytes_total = 2;
  uint32 pieces_done = 3;
  uint32 pieces_total = 4;
  double speed_bps = 5;
  // Отсутствует, если неизвестно.
  optional uint64 eta_secs = 6;
}

// Полное состояние загрузки.
message Download {
  DownloadId id = 1;
  DownloadSpec spec = 2;
  DownloadState state = 3;
  Progress progress = 4;
  // Номер текущей попытки (с 1).
  uint32 attempt = 5;
  // Заполняется только для FAILED / RETRYING.
  optional string error = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// Тик прогресса.
message ProgressEvent {
  DownloadId id = 1;
  Progress progress = 2;
}

// Смена состояния.
message StateChangedEvent {
  DownloadId id = 1;
  DownloadState state = 2;
}

// Обновление отдельного куска — для чанкового прогрессбара.
message WorkerUpdateEvent {
  DownloadId id = 1;
  uint32 piece_index = 2;
  // Доля скачанного в этом piece'е, 0.0..=1.0.
  float fraction = 3;
}

// Загрузка успешно завершена.
message CompletedEvent {
  DownloadId id = 1;
}

// Загрузка упала окончательно.
message FailedEvent {
  DownloadId id = 1;
  string error = 2;
}

// Полный снимок — initial-sync для Watch и реконсиляция после Lagged.
message SnapshotEvent {
  Download download = 1;
}

// Событие в Watch-стриме. Формы варьируются в `kind`.
message Event {
  oneof kind {
    ProgressEvent progress = 1;
    StateChangedEvent state_changed = 2;
    WorkerUpdateEvent worker_update = 3;
    CompletedEvent completed = 4;
    FailedEvent failed = 5;
    SnapshotEvent snapshot = 6;
  }
}

message ListRequest {
}

message ListResponse {
  repeated Download downloads = 1;
}

message AddRequest {
  DownloadSpec spec = 1;
}

message AddResponse {
  DownloadId id = 1;
}

message RemoveRequest {
  DownloadId id = 1;
}

message RemoveResponse {
}

// Запрос по идентификатору загрузки.
message IdRequest {
  DownloadId id = 1;
}

// Универсальный ответ об успехе или ошибке операции.
message StatusResponse {
  bool ok = 1;
  // Описание ошибки при ok = false.
  string message = 2;
}

// Параметры подписки (зарезервировано для будущих фильтров).
message WatchRequest {
}

// Пустой запрос для массовых операций (оставлен как именованный для
// стабильности схемы — при необходимости сюда можно добавить поля без
// breaking change).
message PauseAllRequest {
}

message ResumeAllRequest {
}
