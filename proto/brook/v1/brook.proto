syntax = "proto3";
package brook.v1;

import "google/protobuf/timestamp.proto";

// Основной сервис управления загрузками.
service BrookService {
  // Добавить новый файл в очередь.
  rpc Add(AddRequest) returns (AddResponse);
  // Удалить файл по идентификатору.
  rpc Remove(RemoveRequest) returns (RemoveResponse);

  // Поставить загрузку файла на паузу.
  rpc Pause(IdRequest) returns (StatusResponse);
  // Возобновить приостановленную загрузку файла.
  rpc Resume(IdRequest) returns (StatusResponse);
  // Перезапустить упавшую загрузку (Failed → Pending).
  rpc Retry(IdRequest) returns (StatusResponse);

  // Server-streaming: события жизненного цикла по всем файлам (status,
  // snapshot, completed, failed).
  rpc WatchFile(WatchFileRequest) returns (stream FileEvent);

  // Server-streaming: тики прогресса по всем файлам.
  rpc WatchProgress(WatchProgressRequest) returns (stream ProgressTick);

  // Настройки демона — дефолты и политики — для префилла модалок клиента.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);

  // Попросить демона корректно завершиться. Сервер отдаёт `StatusResponse`
  // сразу (до реального exit'а) и инициирует graceful-shutdown tonic'а
  // с последующим драйном менеджера. Клиент (TUI) использует это, чтобы
  // остановить демон, который сам же и запустил, при выходе из UI.
  rpc Shutdown(ShutdownRequest) returns (StatusResponse);
}

// Уникальный идентификатор файла (UUID в виде строки).
message FileId {
  string value = 1;
}

// Параметры создаваемого файла.
message FileSpec {
  string url = 1;
  // Директория назначения.
  string target_dir = 2;
  // Явно заданное имя файла (пусто — вывести из Content-Disposition/URL).
  optional string filename = 3;
  // Линейный (последовательный) порядок загрузки piece'ов.
  // false (по умолчанию) — стратифицированный рандом + VdC-упорядочивание,
  // воркеры стартуют в разных зонах файла — chunked progress bar.
  // true  — классический порядок слева направо; без chunked progress bar.
  bool linear = 4;
}

// Статус файла.
enum FileStatus {
  FILE_STATUS_UNSPECIFIED = 0;
  FILE_STATUS_PENDING = 1;
  FILE_STATUS_RUNNING = 2;
  FILE_STATUS_PAUSED = 3;
  FILE_STATUS_RETRYING = 4;
  FILE_STATUS_DONE = 5;
  FILE_STATUS_FAILED = 6;
  FILE_STATUS_CANCELLED = 7;
}

// Полное состояние файла. Без прогресса — прогресс отдельным стримом
// WatchProgress.
message File {
  FileId id = 1;
  FileSpec spec = 2;
  FileStatus status = 3;
  // Номер текущей попытки (с 1).
  uint32 attempt = 4;
  // Заполняется только для FAILED / RETRYING.
  optional string error = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// Смена статуса файла.
message StatusChangedEvent {
  FileId id = 1;
  FileStatus status = 2;
}

// Файл успешно скачан.
message CompletedEvent {
  FileId id = 1;
}

// Файл окончательно упал.
message FailedEvent {
  FileId id = 1;
  string error = 2;
}

// Полный снимок — initial-sync для WatchFile и реконсиляция после Lagged.
message SnapshotEvent {
  File file = 1;
}

// Событие жизненного цикла файла. Формы варьируются в `kind`.
message FileEvent {
  oneof kind {
    SnapshotEvent snapshot = 1;
    StatusChangedEvent status_changed = 2;
    CompletedEvent completed = 3;
    FailedEvent failed = 4;
  }
}

// Чанкованное состояние прогрессбара.
// Бэкенд агрегирует piece'ы в N = min(pieces_total, 100) сегментов и
// вычисляет состояние каждого. TUI масштабирует N сегментов под ширину бара.
message BarState {
  // ≤ 100 флоатов, каждый в [0.0, 1.0]:
  //   0.0 = pending, 1.0 = done, промежуточный — resume (часть piece'ов готова).
  repeated float segments = 1;
  // Индексы сегментов, где сейчас работает воркер.
  repeated uint32 worker_positions = 2;
}

// Тик прогресса по одному файлу.
message ProgressTick {
  FileId file_id = 1;
  // Доля скачанного, 0.0..=1.0.
  double progress = 2;
  uint64 bytes_done = 3;
  // 0, если размер неизвестен.
  uint64 bytes_total = 4;
  double speed_bps = 5;
  // Отсутствует, если неизвестно.
  optional uint64 eta_secs = 6;
  // Чанкованное состояние для прогрессбара.
  // Отсутствует при linear=true или когда размер файла ещё не известен.
  optional BarState bar = 7;
}

message AddRequest {
  FileSpec spec = 1;
}

message AddResponse {
  FileId id = 1;
}

message RemoveRequest {
  FileId id = 1;
}

message RemoveResponse {
}

// Запрос по идентификатору файла.
message IdRequest {
  FileId id = 1;
}

// Универсальный ответ об успехе или ошибке операции.
message StatusResponse {
  bool ok = 1;
  // Описание ошибки при ok = false.
  string message = 2;
}

// Параметры подписки на события жизненного цикла файлов.
message WatchFileRequest {
}

// Параметры подписки на прогресс-тики.
message WatchProgressRequest {
}

message GetSettingsRequest {
}

message ShutdownRequest {
}

message GetSettingsResponse {
  // Дефолт для префилла Add-модалки.
  string default_dir = 1;
  reserved 2, 3, 5, 6, 7, 8;
  reserved "default_workers", "max_workers", "piece_target_count",
           "piece_size_min", "piece_size_max", "on_duplicate_url";
  // Лимит одновременных активных загрузок (справочно для UI).
  uint32 max_concurrent = 4;
}
