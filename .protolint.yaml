---
# Подавляем правило MAX_LINE_LENGTH под 80 — у нас 120.
lint:
  rules_option:
    max_line_length:
      max_chars: 120
      tab_chars: 2
    indent:
      style: 2
      not_insert_newline: false
  rules:
    remove:
      # Отключаем требование "RPC names must be CamelCase" → оно и так
      # покрыто PROTO naming convention, но правило иногда конфликтует с
      # vendor-стилем. Тут ничего не отключаем — оставлено как пример.
