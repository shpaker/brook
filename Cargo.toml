[workspace]
members = [
    "crates/brook-proto",
    "crates/brook-core",
    "crates/brook-http",
    "crates/brook-api",
    "crates/brookd",
    "crates/brook-tui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
tokio              = { version = "1",    features = ["full"] }
tonic              = { version = "0.12", features = ["transport"] }
prost              = "0.13"
prost-types        = "0.13"
reqwest            = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
reqwest-middleware = "0.3"
ratatui            = "0.29"
crossterm          = "0.28"
rusqlite           = { version = "0.32", features = ["bundled"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror          = "2"
anyhow             = "1"
directories        = "5"
uuid               = { version = "1", features = ["v4"] }
bytes              = "1"
futures-core       = "0.3"
futures-util       = "0.3"
async-trait        = "0.1"
http               = "1"
mime               = "0.3"
url                = "2"
wiremock           = "0.6"
rand               = "0.8"
fs4                = "0.13"
tempfile           = "3"
serde              = { version = "1", features = ["derive"] }
serde_yaml         = "0.9"
clap               = { version = "4", features = ["derive"] }
indexmap           = "2"
tokio-stream       = "0.1"
arboard            = { version = "3", default-features = false }
